<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="The Forward Deployed Engineer series banner: a compass and route line crossing nine islands from Foundations to Production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123156"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b64c"/>
      <stop offset="1" stop-color="#f4d47c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <!-- dotted route across the banner -->
  <path d="M 60 500 C 260 380, 340 560, 520 430 S 820 250, 1140 150" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <!-- islands along the route -->
  <g fill="#e8b64c">
    <circle cx="60" cy="500" r="10"/>
    <circle cx="330" cy="505" r="8"/>
    <circle cx="520" cy="430" r="10"/>
    <circle cx="710" cy="330" r="8"/>
    <circle cx="880" cy="242" r="10"/>
    <circle cx="1040" cy="176" r="8"/>
  </g>
  <circle cx="1140" cy="150" r="14" fill="none" stroke="#f4d47c" stroke-width="3"/>
  <!-- compass (bottom right) -->
  <g transform="translate(1010,470)">
    <circle r="86" fill="none" stroke="#e8b64c" stroke-width="4"/>
    <circle r="70" fill="none" stroke="#e8b64c" stroke-width="1" opacity="0.5"/>
    <path d="M 0 -58 L 14 0 L 0 58 L -14 0 Z" fill="#f4d47c"/>
    <path d="M 0 -58 L 14 0 L 0 0 Z" fill="#ffffff"/>
    <circle r="7" fill="#0b1f3a" stroke="#e8b64c" stroke-width="2"/>
  </g>
  <!-- titles -->
  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#ffffff">The Forward Deployed Engineer</text>
  <text x="80" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f4d47c">A complete series · from first principles to production</text>
  <text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c9d6e8">Python → Math &amp; Stats → Classical ML → Deep Learning → LLMs, RAG &amp; Agents → Cloud, Security, Delivery</text>
  <text x="80" y="345" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c9d6e8">94 roadmap topics + 24 foundation deep-dives · derivations, practice, sources</text>
  <rect x="80" y="380" width="120" height="4" fill="#e8b64c"/>
</svg>
