<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Cheat sheet CS-001: the Forward Deployed Engineer on one page — definition, four-phase ownership chain with artifacts, five data questions, four-step adoption metric, and the classic failure mode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123156"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>

  <text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#ffffff">The Forward Deployed Engineer — One Page</text>
  <text x="600" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#f4d47c">CS-001 · Introduction · FDE Series</text>

  <!-- definition band -->
  <rect x="80" y="160" width="1040" height="110" rx="14" fill="#152f52" stroke="#e8b64c" stroke-width="2.5"/>
  <text x="600" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">Turns a customer's operational problem into a working, ADOPTED system —</text>
  <text x="600" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">and feeds reusable lessons back to the product team.</text>

  <!-- four phases -->
  <text x="80" y="330" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e8b64c">1 · Own the whole passage</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="21">
    <rect x="80" y="350" width="240" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="200" y="382" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">DISCOVERY</text>
    <text x="200" y="416" text-anchor="middle" fill="#c9d6e8">real workflow +</text>
    <text x="200" y="442" text-anchor="middle" fill="#c9d6e8">bottleneck</text>
    <text x="200" y="480" text-anchor="middle" fill="#f4d47c" font-weight="bold">→ brief</text>

    <rect x="360" y="350" width="240" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="480" y="382" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">BUILD</text>
    <text x="480" y="416" text-anchor="middle" fill="#c9d6e8">smallest system</text>
    <text x="480" y="442" text-anchor="middle" fill="#c9d6e8">that changes it</text>
    <text x="480" y="480" text-anchor="middle" fill="#f4d47c" font-weight="bold">→ code + tests</text>

    <rect x="640" y="350" width="240" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="760" y="382" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">DEPLOY</text>
    <text x="760" y="416" text-anchor="middle" fill="#c9d6e8">runs where the</text>
    <text x="760" y="442" text-anchor="middle" fill="#c9d6e8">work happens</text>
    <text x="760" y="480" text-anchor="middle" fill="#f4d47c" font-weight="bold">→ observed live</text>

    <rect x="920" y="350" width="200" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="1020" y="382" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">HANDOVER</text>
    <text x="1020" y="416" text-anchor="middle" fill="#c9d6e8">they run it</text>
    <text x="1020" y="442" text-anchor="middle" fill="#c9d6e8">without you</text>
    <text x="1020" y="480" text-anchor="middle" fill="#f4d47c" font-weight="bold">→ runbook + owner</text>
  </g>

  <!-- data questions -->
  <text x="80" y="580" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e8b64c">2 · Five questions before touching customer data</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#ffffff">
    <text x="90" y="622">① What exists — and who owns it?</text>
    <text x="640" y="622">② Allowed purpose?</text>
    <text x="90" y="660">③ Where may it live &amp; move?</text>
    <text x="640" y="660">④ Access: who, how granted, expires?</text>
    <text x="90" y="698">⑤ If it leaks — detect + recover how?</text>
    <text x="640" y="698">＋ Synthetic data by default</text>
  </g>

  <!-- two kitchens -->
  <text x="80" y="780" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e8b64c">3 · Two kitchens</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="22">
    <rect x="80" y="800" width="500" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="330" y="835" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">PRODUCT ENGINEERING</text>
    <text x="330" y="870" text-anchor="middle" fill="#c9d6e8">one codebase · a whole market</text>
    <text x="330" y="900" text-anchor="middle" fill="#c9d6e8">roadmap + aggregated feedback</text>
    <text x="330" y="930" text-anchor="middle" fill="#c9d6e8">success: feature adopted at scale</text>

    <rect x="620" y="800" width="500" height="150" rx="12" fill="#152f52" stroke="#e8b64c" stroke-width="2"/>
    <text x="870" y="835" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">FORWARD DEPLOYED</text>
    <text x="870" y="870" text-anchor="middle" fill="#c9d6e8">one customer · their real workflow</text>
    <text x="870" y="900" text-anchor="middle" fill="#c9d6e8">discovery + their constraints</text>
    <text x="870" y="930" text-anchor="middle" fill="#c9d6e8">success: their bottleneck moves</text>
  </g>

  <!-- metric -->
  <text x="80" y="1030" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#e8b64c">4 · Adoption, not applause — the honest metric</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#ffffff">
    <text x="90" y="1072">① Baseline BEFORE building ("unknown" is an answer)</text>
    <text x="90" y="1110">② Name the workflow change, not the feature</text>
    <text x="90" y="1148">③ Instrument with data you already trust</text>
    <text x="90" y="1186">④ Target + schedule + quality pair — then ask:</text>
    <text x="110" y="1220" fill="#f4d47c" font-style="italic">"what cynical behavior would also produce this number?"</text>
  </g>

  <!-- failure banner -->
  <rect x="80" y="1280" width="1040" height="150" rx="14" fill="#3a1520" stroke="#ff7b6b" stroke-width="2.5"/>
  <text x="600" y="1330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ff9d90">THE CLASSIC FAILURE</text>
  <text x="600" y="1370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ff9d90">An impressive demo that never changed a real workflow.</text>
  <text x="600" y="1404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#c9d6e8">Applause is not adoption. Read the instrument after you stop hovering.</text>

  <text x="600" y="1465" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c9d6e8">FDE Series · Day 1 of 95 · chapters, LinkedIn posts &amp; full curriculum linked from the vault index</text>
</svg>
